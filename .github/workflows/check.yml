name: Static portfolio checks
on:
  pull_request:
  push:
    branches: [main, portfolio/engineering-publication]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Generate static site
        run: python3 scripts/build.py
      - name: Validate pages, links, metadata and claim guardrails
        run: python3 scripts/check.py
      - name: Ensure committed pages match their sources
        run: git diff --exit-code -- index.html 404.html projects sitemap.xml robots.txt
